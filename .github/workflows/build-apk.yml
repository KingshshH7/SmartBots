name: Build SmartBot APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK components
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        run: |
          python3 - <<'PYEOF'
with open("build.log", "r", errors="replace") as f:
    lines = f.readlines()
tail = "".join(lines[-180:])
safe = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
print(f"::error::{safe}")
PYEOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartBot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
